[project]
name = "alienrag"
version = "0.1.0"
description = "Local RAG over Alienware manuals (Docling + LanceDB + Ollama)"
authors = [
    { name = "GurjotSDev", email = "har03gur@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.151",
    "gradio>=6.32.0",
    "lancedb>=0.41.0",
    "ollama>=0.6.3",
    "pyarrow>=26.0.1",
    "torch>=2.11",
    "torchvision",
]

[project.scripts]
index = "alienrag.cli:index_main"
ask = "alienrag.cli:ask_main"
eval = "alienrag.cli:eval_main"
ui = "alienrag.cli:ui_main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Docling's documented public imports (docling_core.types.doc) re-export without __all__.
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
